name: Build & publish Genres addon

on:
  schedule:
    - cron: "17 5 * * *"        # daily, 05:17 UTC (IMDb refreshes its datasets overnight)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build catalogs
        env:
          SITE_URL: ${{ vars.SITE_URL != '' && vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}       # Popular / New rows, artwork, descriptions, anime split
          ROW_SIZE: ${{ vars.ROW_SIZE != '' && vars.ROW_SIZE || '100' }}
          ANIME_IN_GENRES: ${{ vars.ANIME_IN_GENRES != '' && vars.ANIME_IN_GENRES || 'false' }}
        run: |
          python build.py
          cp logo.png dist/logo.png

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
